# qqbot 部署编排：NapCat（协议端）+ qqbot（自研框架与面板）
#
# 设计约束（1 核 2G，不可升配）：
#   - 两个容器总内存上限 1.25G，给系统和 1Panel 留出余量
#   - 日志用服务级轮转，**不改 /etc/docker/daemon.json**
#     （daemon.json 是全局的，1Panel 会重写；服务级配置零冲突）
#   - 面板 5333 与 NapCat WebUI 6099 默认绑 0.0.0.0，直接 http://<IP>:端口 访问；
#     OneBot 3001 写死 127.0.0.1，绝不对公网开放
#
# 用法：docker compose --env-file .env up -d

name: qqbot

services:
  # ---------------- 协议端 ----------------
  napcat:
    image: mlikiowa/napcat-docker:${NAPCAT_TAG:-latest}
    container_name: qqbot-napcat
    restart: unless-stopped

    environment:
      # ws = 正向 WebSocket，NapCat 监听 3001，qqbot 作为客户端连上去
      MODE: ws
      WEBUI_TOKEN: ${WEBUI_TOKEN:?缺少 WEBUI_TOKEN，请先运行 install.sh}
      # 1000 是官方 README 的默认值。install.sh 会把 data/napcat 下的目录
      # chown 到 1000:1000，两者必须一致，否则 NapCat 写不进 QQ 配置。
      NAPCAT_UID: "1000"
      NAPCAT_GID: "1000"

    ports:
      # WebUI 要从公网直接访问（手机扫码登录用），靠 WEBUI_TOKEN 保护。
      # 想改回只允许本机：在 etc/env 里设 NAPCAT_WEBUI_BIND=127.0.0.1 再 restart。
      - "${NAPCAT_WEBUI_BIND:-0.0.0.0}:6099:6099"
      # OneBot WebSocket 必须只绑本机，这一条不要改。
      # 默认 access_token 为空，一旦暴露公网，任何人连上来就能冒充机器人发消息。
      # qqbot 走 docker 内网 ws://napcat:3001，根本不需要这个映射，
      # 保留 127.0.0.1 只是为了在宿主机上调试时能连。
      - "127.0.0.1:3001:3001"

    volumes:
      - ./data/napcat/qq:/app/.config/QQ
      - ./data/napcat/config:/app/napcat/config
      - ./data/napcat/plugins:/app/napcat/plugins
      - ./data/napcat/logs:/app/napcat/logs

    # QQNT 底层是 Chromium，默认 64MB 的 /dev/shm 会导致渲染进程随机崩溃。
    # 给 256MB 是折中：够用，且在 2G 机器上不会把内存吃光（shm 走 tmpfs，算内存）。
    shm_size: 256m

    mem_limit: 1024m
    mem_reservation: 512m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      com.qqbot.managed: "true"
      com.qqbot.role: "protocol"

  # ---------------- 框架与面板 ----------------
  qqbot:
    build:
      # 安装目录布局：compose.yaml 在根，源码在 src/
      context: ./src
      # 用哪个 Dockerfile 由 install.sh 写进 etc/env：
      #   Dockerfile.runtime  已经下载到官方预编译二进制，只组装镜像，约 3 秒
      #   Dockerfile          没下载到，在服务器上跑完整 Go 构建，约 90 秒
      # 两者产出的镜像内容等价，切换只影响构建耗时。
      dockerfile: ${QQBOT_DOCKERFILE:-Dockerfile}
      args:
        VERSION: ${QQBOT_VERSION:-dev}
        COMMIT: ${QQBOT_COMMIT:-none}
        BUILD_DATE: ${QQBOT_BUILD_DATE:-unknown}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: qqbot:${QQBOT_VERSION:-dev}
    container_name: qqbot-core
    restart: unless-stopped

    depends_on:
      - napcat

    # 密钥走 env_file 而不是挂文件：容器内是非 root，
    # 读不了宿主上 0600 root 所有的密钥文件，注入环境变量最省事。
    env_file:
      - ./etc/env

    environment:
      # 面板在容器内的监听地址。端口只在这里定义一次：
      # etc/env 的 PANEL_PORT 同时决定「容器监听哪个端口」和「映射到宿主哪个端口」。
      # 覆盖 qqbot.toml 里的 listen，这样改端口不用动只读挂载的配置文件。
      QQBOT_PANEL_LISTEN: "0.0.0.0:${PANEL_PORT:-5333}"

    volumes:
      # 引导配置只读挂载，改完 restart 生效
      - ./etc/qqbot.toml:/opt/qqbot/etc/qqbot.toml:ro
      - ./data/qqbot:/opt/qqbot/data

    ports:
      # 默认绑所有网卡，直接用 http://<服务器IP>:5333 访问，不需要 SSH 隧道。
      # 安全边界靠面板自己的认证：32 位随机密码 + 5 次失败锁定 + 可选 TOTP。
      # 想改回只允许本机：在 etc/env 里设 PANEL_BIND=127.0.0.1 再 restart。
      # 想换端口：改 etc/env 的 PANEL_PORT（内外一起变），然后 restart。
      - "${PANEL_BIND:-0.0.0.0}:${PANEL_PORT:-5333}:${PANEL_PORT:-5333}"

    mem_limit: 256m
    mem_reservation: 64m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      # 容器内自检，端口跟着 PANEL_PORT 走
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PANEL_PORT:-5333}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    labels:
      com.qqbot.managed: "true"
      com.qqbot.role: "core"
